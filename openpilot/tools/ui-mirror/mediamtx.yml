###############################################
# mediamtx 配置 —— 接收 openpilot UI 推来的画面，再分发给车机
# 端口：RTSP 8554 / HLS 8888 / WebRTC 8889 / API 9997

# 全局
logLevel: info
logDestinations: [stdout]

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]

rtmp: no          # 不用，关掉
srt: no

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency   # 比默认 HLS 延迟低一些
hlsSegmentCount: 3

webrtc: yes
webrtcAddress: :8889
webrtcICEServers: []     # 纯内网直连，不依赖外网 STUN

api: yes
apiAddress: :9997

# 连不上就尽快断开，别堆积僵尸连接
readTimeout: 15s
writeTimeout: 15s

###############################################
# 路径配置

paths:
  ui:
    source: publisher          # 等 openpilot UI 里的 ffmpeg 推上来
    runOnDemandCloseAfter: 10s

  ui_small:                    # 备用：低码率版本（可选，暂无用途）
    source: publisher
